<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vincular WhatsApp | Miau Miau</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #232323;
      background: #f5f3ef;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(100%, 560px);
      padding: 36px;
      border: 1px solid #ded9d0;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 50px rgba(39, 35, 30, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: clamp(1.75rem, 6vw, 2.5rem); }
    p { line-height: 1.55; }
    .stack > * + * { margin-top: 18px; }
    .muted { color: #67615a; }
    .error { color: #a62929; }
    .check { display: flex; gap: 12px; align-items: flex-start; line-height: 1.45; }
    .check input { width: 18px; height: 18px; margin-top: 2px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      color: #fff;
      background: #166534;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { cursor: wait; opacity: 0.65; }
    code { padding: 2px 5px; border-radius: 4px; background: #f0ede8; }
  </style>
</head>
<body>
  <main id="vincular-root" aria-live="polite">
    <p class="muted">Cargando vinculación…</p>
  </main>
  <script src="/vincular.js"></script>
</body>
</html>
